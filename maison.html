<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Maison — Fourn’Or</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body data-page="maison">
    <main>
      <section class="maison-open wrap">
        <figure class="maison-open-photo">
          <img src="/images/gal1.jpg" alt="Pains spéciaux Fourn’Or" />
        </figure>
        <div class="maison-open-copy">
          <p class="kicker" data-i18n="page.kicker"></p>
          <h1 data-i18n="maison.hero"></h1>
          <p class="lead" data-i18n="maison.lead"></p>
          <h2 data-i18n="maison.storyTitle"></h2>
          <p data-i18n="maison.story"></p>
        </div>
      </section>

      <section class="section" style="padding-top:0">
        <div class="wrap">
          <div class="section-head">
            <p class="kicker" data-i18n="page.kicker"></p>
            <h2 data-i18n="maison.valuesTitle"></h2>
          </div>
          <div class="values">
            <article class="value">
              <h3 data-i18n="maison.v1"></h3>
              <p data-i18n="maison.v1t"></p>
            </article>
            <article class="value">
              <h3 data-i18n="maison.v2"></h3>
              <p data-i18n="maison.v2t"></p>
            </article>
            <article class="value">
              <h3 data-i18n="maison.v3"></h3>
              <p data-i18n="maison.v3t"></p>
            </article>
            <article class="value">
              <h3 data-i18n="maison.v4"></h3>
              <p data-i18n="maison.v4t"></p>
            </article>
          </div>
        </div>
      </section>

      <section class="section" style="padding-top:0">
        <div class="wrap maison-notes">
          <article>
            <h2 data-i18n="maison.engageTitle"></h2>
            <p data-i18n="maison.engage"></p>
          </article>
          <article>
            <h2 data-i18n="maison.listenTitle"></h2>
            <p data-i18n="maison.listen"></p>
          </article>
        </div>
      </section>

      <section class="section section-charcoal">
        <div class="wrap">
          <p class="kicker" data-i18n="page.kicker"></p>
          <h2 data-i18n="maison.groupTitle"></h2>
          <p class="lead" data-i18n="maison.group"></p>
        </div>
      </section>

      <section class="section">
        <div class="wrap">
          <div class="section-head">
            <p class="kicker" data-i18n="maison.partnersTitle"></p>
            <h2 data-i18n="maison.partnersLead"></h2>
          </div>
          <ul class="partner-list" id="partners"></ul>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
