<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var l = localStorage.getItem("fournor-lang");
        if (l === "ar" || l === "en" || l === "fr") {
          document.documentElement.lang = l;
          document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="preload" as="image" href="/logo-satia-clear.webp" fetchpriority="high" />
    <meta name="theme-color" content="#f4efe6" />
    <meta name="description" content="SATIA accompagne les industriels agroalimentaires, pâtissiers et artisans boulangers : solutions, mélanges et ingrédients." />
    <title>Présentation — SATIA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body data-page="maison">
    <main>
      <section class="page-open wrap">
        <figure class="page-open-photo page-open-logo">
          <img src="/logo-satia-clear.webp" alt="SATIA" width="640" height="366" fetchpriority="high" decoding="async" />
        </figure>
        <div class="page-open-copy">
          <p class="kicker" data-i18n="page.kicker"></p>
          <h1 data-i18n="maison.hero">Présentation</h1>
          <p class="lead" data-i18n="maison.lead"></p>
          <p data-i18n="hero.quote"></p>
        </div>
      </section>

      <section class="section" style="padding-top:0">
        <div class="wrap pres-pillars">
          <article class="reveal">
            <h2 data-i18n="sol.hero">Solution</h2>
            <p class="pillar-tagline" data-i18n="sol.title"></p>
            <p data-i18n="sol.lead"></p>
            <p data-i18n="sol.text"></p>
            <a class="btn btn-gold" href="/solution.html" data-i18n="pillars.seeSol"></a>
          </article>
          <article class="reveal">
            <h2 data-i18n="atelier.kicker">Mélanges</h2>
            <p class="pillar-tagline" data-i18n="atelier.title"></p>
            <p data-i18n="atelier.lead"></p>
            <p data-i18n="maison.mixExtra"></p>
            <a class="btn btn-gold" href="/gamme.html" data-i18n="pillars.seeMix"></a>
          </article>
          <article class="reveal">
            <h2 data-i18n="ing.hero">Ingrédients</h2>
            <p class="pillar-tagline" data-i18n="ing.title"></p>
            <p data-i18n="ing.lead"></p>
            <p data-i18n="ing.text"></p>
            <a class="btn btn-gold" href="/ingredients.html" data-i18n="pillars.seeIng"></a>
          </article>
        </div>
      </section>

      <section class="section" style="padding-top:0">
        <div class="cta-band reveal">
          <div>
            <h2 data-i18n="cta.title"></h2>
            <p data-i18n="cta.text"></p>
          </div>
          <a class="btn btn-gold" href="/contact.html" data-i18n="cta.btn"></a>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
