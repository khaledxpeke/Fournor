<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fourn’Or — L’or de votre fournil</title>
    <meta name="description" content="Fourn’Or, prémix de farines spéciales pour boulangers. Une marque de Société Tayara Distribution, Tunis." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body data-page="home">
    <main>
      <section class="hero">
        <img class="hero-bg" src="/images/hero.jpg" alt="Boulangers au fournil Tayara" />
        <div class="hero-copy reveal">
          <p class="kicker" data-i18n="hero.kicker"></p>
          <h1 data-i18n="hero.title"></h1>
          <p class="lead" data-i18n="hero.lead"></p>
          <div class="hero-actions">
            <a class="btn btn-gold" href="/gamme.html" data-i18n="hero.cta1"></a>
            <a class="btn btn-ghost" href="/contact.html" data-i18n="hero.cta2"></a>
          </div>
          <p class="hero-quote" data-i18n="hero.quote"></p>
        </div>
        <span class="hero-caption">Le goût du vrai</span>
      </section>

      <div class="marquee" aria-hidden="true">
        <div class="marquee-track">
          <span>Banette</span><span>Tradition</span><span>Complet</span><span>Campagne</span><span>Céréales noir</span><span>Scandinave</span><span>Chia quinoa</span><span>Maxi graines</span><span>Multigrain</span><span>Maïs</span>
          <span>Banette</span><span>Tradition</span><span>Complet</span><span>Campagne</span><span>Céréales noir</span><span>Scandinave</span><span>Chia quinoa</span><span>Maxi graines</span><span>Multigrain</span><span>Maïs</span>
        </div>
      </div>

      <section class="section">
        <div class="wrap">
          <div class="section-head reveal">
            <p class="kicker" data-i18n="dosage.kicker"></p>
            <h2 data-i18n="dosage.title"></h2>
            <p data-i18n="dosage.lead"></p>
          </div>
          <div class="rings">
            <article class="ring-card reveal">
              <div class="orb">
                <img src="/images/banette.png" alt="" />
                <div class="ring" data-pct="2"><span class="ring-pct">2%</span></div>
              </div>
              <h3 data-dosage-label="2"></h3>
              <p data-dosage-blurb="2"></p>
              <a class="more" href="/gamme.html" data-i18n="dosage.see"></a>
            </article>
            <article class="ring-card reveal">
              <div class="orb">
                <img src="/images/complet.png" alt="" />
                <div class="ring" data-pct="30"><span class="ring-pct">30%</span></div>
              </div>
              <h3 data-dosage-label="30"></h3>
              <p data-dosage-blurb="30"></p>
              <a class="more" href="/gamme.html" data-i18n="dosage.see"></a>
            </article>
            <article class="ring-card reveal">
              <div class="orb">
                <img src="/images/multigrain.png" alt="" />
                <div class="ring" data-pct="50"><span class="ring-pct">50%</span></div>
              </div>
              <h3 data-dosage-label="50"></h3>
              <p data-dosage-blurb="50"></p>
              <a class="more" href="/gamme.html" data-i18n="dosage.see"></a>
            </article>
          </div>
        </div>
      </section>

      <section class="section" style="padding-top:0">
        <div class="wide">
          <div class="section-head reveal">
            <p class="kicker" data-i18n="atelier.kicker"></p>
            <h2 data-i18n="atelier.title"></h2>
            <p data-i18n="atelier.lead"></p>
            <a class="btn btn-ghost" href="/gamme.html" data-i18n="atelier.all"></a>
          </div>
          <div class="atelier-stage">
            <button type="button" class="rail-nav prev" id="atelier-prev" aria-label="Précédent">‹</button>
            <div class="atelier" id="atelier-rail" tabindex="0"></div>
            <button type="button" class="rail-nav next" id="atelier-next" aria-label="Suivant">›</button>
          </div>
        </div>
      </section>

      <section class="section" style="padding-top:0">
        <div class="wrap stats reveal">
          <div>
            <p class="kicker" data-i18n="maison.kicker"></p>
            <div class="stat-row">
              <div class="stat"><b data-i18n="maison.stat1"></b><span data-i18n="maison.stat1l"></span></div>
              <div class="stat"><b data-i18n="maison.stat2"></b><span data-i18n="maison.stat2l"></span></div>
              <div class="stat"><b data-i18n="maison.stat3"></b><span data-i18n="maison.stat3l"></span></div>
            </div>
          </div>
          <div>
            <h2 data-i18n="maison.title"></h2>
            <p data-i18n="maison.text"></p>
            <a class="btn btn-gold" href="/maison.html" data-i18n="maison.more"></a>
          </div>
        </div>
      </section>

      <section class="feature reveal">
        <img src="/images/fournil.jpg" alt="Fournil d’essai STD" />
        <div class="feature-card">
          <p class="kicker" data-i18n="fournil.kicker"></p>
          <h2 data-i18n="fournil.title"></h2>
          <p data-i18n="fournil.text"></p>
          <a class="btn btn-gold" href="/expertise.html" data-i18n="fournil.cta"></a>
        </div>
      </section>

      <section class="section" style="padding-top:0">
        <div class="wrap">
          <div class="section-head reveal">
            <p class="kicker" data-i18n="news.kicker"></p>
            <h2 data-i18n="news.title"></h2>
            <a class="more" href="/actualites.html" data-i18n="news.all"></a>
          </div>
          <div id="home-news"></div>
        </div>
      </section>

      <section class="section" style="padding-top:0">
        <div class="cta-band reveal">
          <div>
            <h2 data-i18n="cta.title"></h2>
            <p data-i18n="cta.text"></p>
          </div>
          <a class="btn btn-gold" href="/contact.html" data-i18n="cta.btn"></a>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
