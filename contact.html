<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var l = localStorage.getItem("fournor-lang");
        if (l === "ar" || l === "en" || l === "fr") {
          document.documentElement.lang = l;
          document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <meta name="theme-color" content="#f4efe6" />
    <meta name="description" content="Contacter SATIA à Soliman : Route de Korbous km 2, 8020 Soliman, Nabeul. Tél. +216 98 692 222." />
    <title>Contact — Fourn’Or</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body data-page="contact">
    <main>
      <section class="page-hero wrap">
        <p class="kicker" data-i18n="page.kicker"></p>
        <h1 data-i18n="contact.hero">Contact</h1>
        <p class="lead" data-i18n="contact.lead"></p>
      </section>
      <section class="section" style="padding-top:0">
        <div class="wrap contact-grid">
          <form class="form" id="contact-form" novalidate>
            <div>
              <label for="name" data-i18n="contact.formName"></label>
              <input id="name" name="name" type="text" required autocomplete="name" dir="auto" />
            </div>
            <div>
              <label for="email" data-i18n="contact.formEmail"></label>
              <input id="email" name="email" type="email" required autocomplete="email" dir="ltr" />
            </div>
            <div>
              <label for="message" data-i18n="contact.formMsg"></label>
              <textarea id="message" name="message" required dir="auto"></textarea>
            </div>
            <p class="form-note" id="form-note" role="status"></p>
            <button class="btn btn-gold" type="submit" data-i18n="contact.send"></button>
          </form>
          <aside>
            <h2 data-i18n="contact.visit"></h2>
            <p data-i18n="footer.address"></p>
            <p>
              <a class="contact-line" href="tel:+21698692222">
                <span data-i18n="footer.phone"></span>
                <span dir="ltr">+216 98 692 222</span>
              </a>
            </p>
            <iframe
              class="map-frame"
              title="SATIA — Soliman"
              src="https://maps.google.com/maps?q=Route%20de%20Korbous%20km%202%208020%20Soliman%20Nabeul&z=15&output=embed"
              loading="lazy"
            ></iframe>
            <p>
              <a class="more" href="https://maps.google.com/?q=Route+de+Korbous+km+2+8020+Soliman+Nabeul" target="_blank" rel="noopener noreferrer" data-i18n="contact.map"></a>
            </p>
          </aside>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
