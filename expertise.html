<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expertise — Fourn’Or</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body data-page="expertise">
    <main>
      <section class="page-hero wrap">
        <p class="kicker" data-i18n="page.kicker"></p>
        <h1 data-i18n="exp.hero"></h1>
        <p class="lead" data-i18n="exp.lead"></p>
      </section>
      <section class="split">
        <img src="/images/gal2.jpg" alt="Travail au fournil" />
        <div class="split-copy">
          <h2 data-i18n="exp.whatTitle"></h2>
          <p data-i18n="exp.what"></p>
        </div>
      </section>
      <section class="section">
        <div class="wrap">
          <div class="composer">
            <div class="composer-copy">
              <p class="kicker" data-i18n="exp.compose"></p>
              <h2 data-i18n="exp.composeLead"></h2>
              <div class="composer-pick">
                <label for="composer-select" data-i18n="gamme.sku"></label>
                <select id="composer-select"></select>
              </div>
            </div>
            <div class="composer-visual" id="composer-visual"></div>
          </div>
        </div>
      </section>
      <section class="section section-charcoal">
        <div class="wrap stats">
          <div>
            <h2 data-i18n="exp.trainersTitle"></h2>
            <p data-i18n="exp.trainers"></p>
          </div>
          <div>
            <h2 data-i18n="exp.rdTitle"></h2>
            <p data-i18n="exp.rd"></p>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
