<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var l = localStorage.getItem("fournor-lang");
        if (l === "ar" || l === "en" || l === "fr") {
          document.documentElement.lang = l;
          document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="preload" as="image" href="/images/expertise.webp" fetchpriority="high" />
    <meta name="theme-color" content="#f4efe6" />
    <meta name="description" content="Le prémix, le fournil d’essai et l’accompagnement des boulangers-formateurs Fourn’Or à Tunis." />
    <title>Expertise — Fourn’Or</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body data-page="expertise">
    <main>
      <section class="page-open wrap">
        <figure class="page-open-photo">
          <img src="/images/expertise.webp" alt="Façonnage de la pâte au fournil" width="1600" height="1200" fetchpriority="high" decoding="async" />
        </figure>
        <div class="page-open-copy">
          <p class="kicker" data-i18n="page.kicker"></p>
          <h1 data-i18n="exp.hero">Expertise</h1>
          <p class="lead" data-i18n="exp.lead"></p>
          <h2 data-i18n="exp.whatTitle"></h2>
          <p data-i18n="exp.what"></p>
        </div>
      </section>

      <section class="section" style="padding-top:0">
        <div class="wrap">
          <div class="composer">
            <div class="composer-copy">
              <p class="kicker" data-i18n="exp.compose"></p>
              <h2 data-i18n="exp.composeLead"></h2>
              <div class="composer-pick">
                <label for="composer-trigger" id="composer-label" data-i18n="gamme.sku"></label>
                <div class="fo-select" id="composer-select"></div>
              </div>
            </div>
            <div class="composer-visual" id="composer-visual"></div>
          </div>
        </div>
      </section>

      <section class="section" style="padding-top:0">
        <div class="wrap page-notes">
          <article>
            <h2 data-i18n="exp.trainersTitle"></h2>
            <p data-i18n="exp.trainers"></p>
          </article>
          <article>
            <h2 data-i18n="exp.rdTitle"></h2>
            <p data-i18n="exp.rd"></p>
          </article>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
