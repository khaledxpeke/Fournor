name: Rebuild frontend

on:
  repository_dispatch:
    types: [cms-publish]
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: rebuild-frontend
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the deployed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.DEPLOY_BRANCH || github.event.repository.default_branch }}

      - name: Write the build stamp
        run: |
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.event_name }}" > web/.build-stamp

      - name: Commit the stamp
        env:
          BRANCH: ${{ vars.DEPLOY_BRANCH || github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/.build-stamp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Rebuild frontend after CMS publish"
          git push origin "HEAD:${BRANCH}"
